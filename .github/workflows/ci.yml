name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.5.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/pre-commit
          key: ${{ runner.os }}-bun-1.4.4-node-22.5.0-python-3.12-${{ hashFiles('bun.lock', '.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install hook runner
        run: uv tool install --python 3.12 pre-commit==3.6.2

      - name: Check prerequisites
        run: make prerequisites

      - name: Prepare unit-test fixture directory
        run: mkdir -p /tmp/opencode

      - name: Run unit tests with coverage
        run: make coverage

      - name: Run quality and secret-scanning hooks
        run: make hooks

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
